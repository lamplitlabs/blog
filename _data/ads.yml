# Our own ads: one small card per post for a Lamplit Labs product.
#
# How it works (all of it happens when the site is built; nothing runs in the
# reader's browser):
#   - _includes/product-ad.html picks at most one entry below for each post and
#     _layouts/post.html prints it between two sections of the article (after
#     the text when the post has fewer than four sections).
#   - An entry with `topics:` is shown only on posts that carry one of those
#     categories or tags. Entries without `topics:` fit every post and are used
#     when no topical entry matches.
#   - A post never shows the card of a site its own text already links to.
#   - Among the entries that fit, the post's date and title length pick one, so
#     a post keeps the same card until this file changes.
#
# No tracking, by rule (tools/test.sh fails the build otherwise): a card is
# plain HTML with one link. No script, no image or frame from another host, no
# cookie, no click counter, and no query string on the link (so no utm_ tags).
# The site's own Google Analytics tag is separate; see "Our own ads" in the
# README for what it still records.
#
# To turn it off: set `enabled: false` here for the whole site, or `ad: false`
# in one post's front matter. `ad: <id>` in a post's front matter picks one
# entry by hand. `active: false` parks one entry. `placement: end` moves the
# card from the middle of the article to the end of its text.
#
# Fields: id (unique), product (the name shown in bold), title (up to 70
# characters), text (up to 220), url (https, no query string), cta (the link's
# words), logo (a file in this repository), topics (optional list).
enabled: true
placement: middle # middle: between two sections of the article; end: after its text

