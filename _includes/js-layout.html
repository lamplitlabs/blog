{% comment %} Layout-specific CDN libraries (glightbox, clipboard, dayjs). Lazysizes and
magnific-popup were dropped by the vendored theme (jekyll-theme-chirpy 7.6.0 no longer ships their
origin entries), so they are no longer appended here to avoid emitting empty <script src=""> tags.
GLightbox replaced magnific-popup as the image popup: post.min.js and page.min.js call GLightbox()
at load, so post and page layouts must load it or the bundle throws a ReferenceError and stops
before wiring the sidebar toggle. Appends to `urls`. {% endcomment %}
{% if page.layout == 'post' or page.layout == 'page' or page.layout == 'home' %}
{% unless page.layout == 'home' %}
{% assign urls = urls | append: ',' | append:
site.data.origin[type].glightbox.js | append: ',' | append:
site.data.origin[type].clipboard.js %}
{% endunless %}
{% endif %}
{% if page.layout == 'home' or page.layout == 'post' or page.layout == 'archives' or page.layout == 'category' or page.layout == 'tag' %}
{% assign locale = site.lang | split: '-' | first %}
{% assign urls = urls | append: ',' | append:
site.data.origin[type].dayjs.js.common | append: ',' | append:
site.data.origin[type].dayjs.js.locale | replace: ':LOCALE', locale | append: ',' | append:
site.data.origin[type].dayjs.js.relativeTime | append: ',' | append:
site.data.origin[type].dayjs.js.localizedFormat %}
{% endif %}
